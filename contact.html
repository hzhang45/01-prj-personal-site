        <main>
            <form class=form name="submit-to-google-sheet" action="#">
                <p>My Email: ineedalotofmilk@gmail.com</p>
                <p>My Number: 571-525-0820</p>
                <div>
                    <lable for="form_name">Name:</lable>
                    <input name="name" id="form_name" value="Your Name" required>
                </div>
                <br>
                <div>
                    <lable for="form_email">Email:</lable>
                    <input name="email" id="form_email" value="Your Email" required>
                </div>
                <br>
                <div>
                    <lable for="form_phone">Phone:</lable>
                    <input name="phone" id="form_phone" value="Your Phone">
                </div>
                <br>
                <div>
                    <lable for="form_drop">Are you an art student?</lable>
                    <select name="dropdown" id="form_drop">
                        <option value="-">-</option>
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>
                <br>
                <div>
                    <lable for="form_textarea">Your Message:</lable>
                    <textarea id="form_textarea" name="textarea"></textarea>
                </div>
                <br>
                <input class=submitreset type="submit" value="Submit">
                <input class=submitreset type="reset" value="Reset">
            </form>
            <span id="msg"></span>
            <script>
                const scriptURL = 'https://script.google.com/macros/s/AKfycbxmbd8cDU_CuN1S8RuvcVF6ec_TkWqR059JWIFTO4dLgcV1X2H2AOGkD48W9Iu5Q7henw/exec'
                const form = document.forms['submit-to-google-sheet']
                const msg = document.getElementById("msg")
              
                form.addEventListener('submit', e => {
                  e.preventDefault()
                  fetch(scriptURL, { method: 'POST', body: new FormData(form)})
                    .then(response => {
                        msg.innerHTML = "Your form has been submitted succesfully"
                        setTimeout(function(){
                            msg.innerHTML = ""
                        }, 5000)
                        form.reset()
                    })
                    .catch(error => console.error('Error!', error.message))
                })
              </script>
        </main>
